name: ${COMPOSE_PROJECT_NAME:-dist_tx}

x-hardening: &hardening
  read_only: false
  cap_drop: [ALL]
  security_opt: []
  init: false
  deploy:
    resources:
      limits:
        pids: 256
  restart: unless-stopped
  logging: &logging
    driver: local
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:18-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    security_opt: []
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    networks: [backend]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: dist_tx_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [db_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dist_tx_engine"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1G }
    logging: *logging

  cache:
    <<: *hardening
    cap_drop: []
    image: redis:7.4-bookworm@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    networks: [backend]
    ports:
      - "6379:6379"
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits: { memory: 256M }

  kafka:
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    restart: unless-stopped
    security_opt: []
    cap_drop: []
    networks: [backend]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "4L622nShTUiT8NYvQvGh2w"
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    logging: *logging

  tempo:
    <<: *hardening
    init: false
    cap_drop: []
    security_opt: []
    image: grafana/tempo:2.6.0@sha256:f55a8a1937fff0af3a760d376b476c8327fb30e432d5e7630d7938b67691e822
    command: ["-config.file=/etc/tempo.yaml"]
    networks:
      backend:
        aliases:
          - tempo
      frontend:
        aliases:
          - tempo
    ports:
      - "3200:3200"
    tmpfs: [/tmp]
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/ready || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 512M }

  loki:
    <<: *hardening
    cap_drop: []
    security_opt: []
    image: grafana/loki:3.1.1@sha256:e689cc634841c937de4d7ea6157f17e29cf257d6a320f1c293ab18d46cfea986
    command: ["-config.file=/etc/loki/local-config.yaml"]
    networks:
      backend:
        aliases:
          - loki
      frontend:
        aliases:
          - loki
    ports:
      - "3100:3100"
    tmpfs: [/tmp]
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 512M }

  prometheus:
    <<: *hardening
    cap_drop: []
    security_opt: []
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/tmp/prometheus"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    networks:
      backend:
        aliases:
          - prometheus
      frontend:
        aliases:
          - prometheus
    ports:
      - "9090:9090"
    tmpfs: [/tmp]
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "wget -qO- http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: { memory: 512M }

  otel-collector:
    <<: *hardening
    cap_drop: []
    image: otel/opentelemetry-collector-contrib:0.108.0@sha256:923eb1cfae32fe09676cfd74762b2b237349f2273888529594f6c6ffe1fb3d7e
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      tempo:
        condition: service_healthy
    networks: [backend, frontend]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    tmpfs: [/tmp]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    deploy:
      resources:
        limits: { memory: 256M }

  grafana:
    <<: *hardening
    cap_drop: []
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    ports: ["3000:3000"]
    networks: [frontend, backend]
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    tmpfs: [/tmp]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 512M }

  proxy:
    <<: *hardening
    cap_drop: []
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    ports: ["8080:8080"]
    networks: [frontend]
    volumes:
      - ${PROXY_CONFIG:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    tmpfs: [/config, /tmp]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  frontend: {}
  backend: {}
  egress: {}

volumes:
  pgdata:
    name: ${COMPOSE_PROJECT_NAME:-dist_tx}_pgdata
  kafkadata:
    name: ${COMPOSE_PROJECT_NAME:-dist_tx}_kafkadata
  caddy_data: {}

secrets:
  db_password:
    file: ${SECRETS_DIR:-./secrets}/db_password.txt
