include:
  - path: docker-compose.infra.yml

# no-new-privileges breaks container start under the snap-packaged Docker (AppArmor); set DTX_NO_NEW_PRIVILEGES=true on other hosts.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:${DTX_NO_NEW_PRIVILEGES:-false}"]
  init: true
  restart: unless-stopped
  logging: { driver: local, options: { max-size: "10m", max-file: "5" } }

services:
  app:
    <<: *hardening
    image: ${APP_IMAGE:-distributed-transaction-engine:local}
    build:
      context: ../../..
      dockerfile: deploy/docker/service/Dockerfile
    depends_on:
      db:    { condition: service_healthy, restart: true }
      cache: { condition: service_healthy, restart: true }
      kafka: { condition: service_healthy, restart: true }
    networks: [frontend, backend]
    expose: ["8080", "8081"]
    environment:
      DB_HOST: db
      CACHE_HOST: cache
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4318
      ADMIN_PORT: "8081"
      AUTH_MODE: disabled
      DB_RLS_ENFORCED: "false"
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    tmpfs: [/tmp]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/app/bin/engine", "--config", "/app/config/default.yaml", "healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:       { cpus: "1.0", memory: 512M }
        reservations: { memory: 128M }
    ulimits:
      nofile: { soft: 65535, hard: 65535 }

  app-dev:
    profiles: [dev]
    build:
      context: ../../..
      dockerfile: deploy/docker/service/Dockerfile.dev
      args:
        SERVICE_PATH: .
    depends_on:
      db:    { condition: service_healthy }
      cache: { condition: service_healthy }
      kafka: { condition: service_healthy }
    networks: [backend]
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:8081:8081"]
    environment:
      DB_HOST: db
      CACHE_HOST: cache
      KAFKA_BROKERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4318
      ADMIN_PORT: "8081"
      AUTH_MODE: disabled
      DB_RLS_ENFORCED: "false"
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    develop:
      watch:
        - { action: sync,         path: ../../../src,    target: /app/src }
        - { action: sync+restart, path: ../../../config, target: /app/config }
        - { action: rebuild,      path: ../../../go.mod }
