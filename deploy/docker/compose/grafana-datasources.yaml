apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: '1h'
        spanEndTimeShift: '1h'

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '(?:trace_id|traceId)=(\w+)'
          name: TraceID
          url: '$${__value.raw}'

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: db:5432
    database: dist_tx_engine
    user: postgres
    secureJsonData:
      password: supersecretpgpassword
    jsonData:
      sslmode: disable
      postgresVersion: 1800
    isDefault: false
    editable: false
