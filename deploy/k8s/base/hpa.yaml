apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: distributed-transaction-engine-hpa
  labels:
    app.kubernetes.io/name: distributed-transaction-engine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: distributed-transaction-engine
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
