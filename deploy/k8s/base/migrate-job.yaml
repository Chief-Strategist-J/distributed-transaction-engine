apiVersion: batch/v1
kind: Job
metadata:
  name: distributed-transaction-engine-migrate
  labels:
    app.kubernetes.io/name: distributed-transaction-engine
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distributed-transaction-engine
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: gcr.io/dist-tx-engine/distributed-transaction-engine:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["/app/bin/engine", "--config", "/app/config/default.yaml", "migrate"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: ENV
              value: production
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: engine-credentials
                  key: db_owner_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: engine-credentials
                  key: db_owner_password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: auth-jwks
              mountPath: /etc/dtx/auth
              readOnly: true
            - name: db-ca
              mountPath: /etc/dtx/db
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: engine-config
        - name: auth-jwks
          secret:
            secretName: engine-credentials
            items:
              - key: auth_jwks
                path: jwks.json
        - name: db-ca
          secret:
            secretName: engine-credentials
            items:
              - key: db_ca_cert
                path: ca.crt
