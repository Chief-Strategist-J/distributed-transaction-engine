apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-transaction-engine
  labels:
    app.kubernetes.io/name: distributed-transaction-engine
    app.kubernetes.io/part-of: distributed-transaction-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: distributed-transaction-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: distributed-transaction-engine
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: engine
          image: gcr.io/dist-tx-engine/distributed-transaction-engine:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http-public
              containerPort: 8080
              protocol: TCP
            - name: http-admin
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: http-admin
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http-admin
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          env:
            - name: ENV
              value: production
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: engine-credentials
                  key: db_password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: auth-jwks
              mountPath: /etc/dtx/auth
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: engine-config
        - name: auth-jwks
          secret:
            secretName: engine-credentials
            items:
              - key: auth_jwks
                path: jwks.json
