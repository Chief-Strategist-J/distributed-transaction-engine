apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: dist-tx-engine-prod
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: engine-secrets
  labels:
    app.kubernetes.io/name: distributed-transaction-engine
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: engine-credentials
    creationPolicy: Owner
  data:
    - secretKey: db_password
      remoteRef:
        key: dist-tx-db-login-password
    - secretKey: redis_auth_token
      remoteRef:
        key: dist-tx-redis-auth
    - secretKey: kafka_sasl_password
      remoteRef:
        key: dist-tx-kafka-password
    - secretKey: auth_jwks
      remoteRef:
        key: dist-tx-auth-jwks
    - secretKey: kafka_sasl_username
      remoteRef:
        key: dist-tx-kafka-username
    - secretKey: kafka_ca_cert
      remoteRef:
        key: dist-tx-kafka-ca
    - secretKey: db_ca_cert
      remoteRef:
        key: dist-tx-db-ca
    - secretKey: db_owner_user
      remoteRef:
        key: dist-tx-db-owner-user
    - secretKey: db_owner_password
      remoteRef:
        key: dist-tx-db-password
