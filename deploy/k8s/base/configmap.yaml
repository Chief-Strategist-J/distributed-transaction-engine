apiVersion: v1
kind: ConfigMap
metadata:
  name: engine-config
  labels:
    app.kubernetes.io/name: distributed-transaction-engine
data:
  default.yaml: |
    server:
      name: "distributed-transaction-engine"
      bind_address: "0.0.0.0:8080"
      admin_bind_address: "0.0.0.0:8081"
      read_timeout_seconds: 15
      write_timeout_seconds: 15
      idle_timeout_seconds: 75
      shutdown_deadline_seconds: 35
      max_body_bytes: 10485760
      expose_error_details: false
    database:
      host: ""
      port: "5432"
      user: "dtx_login"
      password: ""
      name: "dist_tx_engine"
      sslmode: "verify-full"
      sslrootcert: "/etc/dtx/db/ca.crt"
      max_open_conns: 50
      max_idle_conns: 10
      conn_max_lifetime_minutes: 5
      migrations_dir: "database/migrations/sql"
      rls_enforced: true
      auto_migrate: false
    poller:
      worker_id: ""
      lease_duration_seconds: 30
      poll_interval_millis: 250
    kafka:
      brokers: ""
      auto_create_topics: false
      tls_enabled: true
      ca_file: "/etc/dtx/kafka/ca.crt"
      sasl_mechanism: "SCRAM-SHA-512"
      replication_factor: 3
      write_timeout_millis: 5000
      batch_timeout_millis: 10
    outbox:
      relay_interval_millis: 500
      relay_batch_size: 100
    auth:
      mode: "jwt"
      jwks_file: "/etc/dtx/auth/jwks.json"
      issuer: ""
      audience: ""
      leeway_seconds: 60
    endpoints:
      base_path: "/api/v1"
