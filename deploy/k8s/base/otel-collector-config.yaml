apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app.kubernetes.io/name: otel-collector
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      postgresql:
        endpoint: postgres:5432
        transport: tcp
        username: postgres
        password: supersecretpgpassword
        databases:
          - dist_tx_engine
        collection_interval: 15s
        tls:
          insecure: true

      redis:
        endpoint: redis:6379
        collection_interval: 15s

      kafkametrics:
        brokers:
          - kafka:9092
        protocol_version: 3.6.0
        collection_interval: 15s
        scrapers:
          - brokers
          - topics
          - consumers

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 200
        spike_limit_mib: 50
      tail_sampling:
        decision_wait: 10s
        num_traces: 50000
        expected_new_traces_per_sec: 500
        policies:
          - name: keep-errors
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: keep-slow
            type: latency
            latency:
              threshold_ms: 1000
          - name: sample-the-rest
            type: probabilistic
            probabilistic:
              sampling_percentage: 10
      batch:
        timeout: 1s
        send_batch_size: 256
      attributes:
        actions:
          - key: service.name
            action: insert
            value: "distributed-transaction-engine"
          - key: loki.resource.labels
            action: insert
            value: "service.name, environment"

    exporters:
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      otlphttp/loki:
        endpoint: http://loki:3100/otlp
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: otel
      logging:
        verbosity: basic

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, tail_sampling, batch]
          exporters: [otlp/tempo, logging]
        logs:
          receivers: [otlp]
          processors: [attributes, batch]
          exporters: [otlphttp/loki, logging]
        metrics:
          receivers: [otlp, postgresql, redis, kafkametrics]
          processors: [batch]
          exporters: [prometheus, logging]
