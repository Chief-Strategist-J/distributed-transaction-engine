          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - name
                - version
                - source
                - externalId
                - correlationId
                - steps
              properties:
                tenantId:
                  type: string
                name:
                  type: string
                  pattern: "^[a-zA-Z0-9_\\-\\.]{3,128}$"
                version:
                  type: integer
                  minimum: 1
                source:
                  type: string
                externalId:
                  type: string
                correlationId:
                  type: string
                  format: uuid
                steps:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - stepId
                      - stepName
                      - isPivot
                      - actionType
                      - actionEndpoint
                      - timeoutSeconds
                    properties:
                      stepId:
                        type: string
                        pattern: "^[a-zA-Z0-9_\\-]{2,64}$"
                      stepName:
                        type: string
                      isPivot:
                        type: boolean
                      actionType:
                        type: string
                      actionEndpoint:
                        type: string
                      compensationAction:
                        type: string
                      compensationEndpoint:
                        type: string
                      timeoutSeconds:
                        type: integer
                        minimum: 1
                        maximum: 86400
                      maxRetries:
                        type: integer
                        minimum: 0
                        maximum: 100
                      dependencies:
                        type: array
                        items:
                          type: string
      responses:
        '201':
          description: Workflow definition registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinitionResponse'
        '400':
          description: Schema validation error, missing required fields, cyclic dependency, disconnected graph, or unknown dependency (VALIDATION_FAILED)
        '409':
          description: Duplicate version or spec hash conflict
    get:
      summary: List registered workflow definitions for a tenant
      operationId: listWorkflowDefinitions
      parameters:
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of workflow definitions
  /api/v1/workflow-definitions/{id}:
    get:
      summary: Retrieve workflow definition by ID
      operationId: getWorkflowDefinitionById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow definition found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinitionResponse'
        '404':
          description: Workflow definition not found
  /api/v1/crash-recovery/status:
    get:
      summary: Retrieve crash recovery daemon status and active configuration
      operationId: getCrashRecoveryStatus
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Crash recovery status and configuration details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrashRecoveryStatusResponse'
  /api/v1/crash-recovery/orphans:
    get:
      summary: Query expired orphan sagas awaiting takeover
      operationId: getCrashRecoveryOrphans
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of orphaned saga instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrashRecoveryOrphansResponse'
  /api/v1/crash-recovery/sweep:
    post:
      summary: Trigger immediate manual sweep and reclamation cycle
      operationId: triggerCrashRecoverySweep
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                batchLimit:
                  type: integer
      responses:
        '200':
          description: Sweep execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrashRecoverySweepResponse'
        '400':
          description: Validation failed on unrecognized payload fields
components:
  schemas:
    WorkflowDefinitionResponse:
      type: object
      required:
        - success
        - statusCode
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            publicId:
              type: string
              pattern: "^wfd_[0-9a-zA-Z]{26}$"
            tenantId:
              type: string
            name:
              type: string
            version:
              type: integer
            source:
              type: string
            externalId:
              type: string
            correlationId:
              type: string
            specHash:
              type: string
            status:
              type: string
              enum: [ACTIVE, DEPRECATED, ARCHIVED]
            totalSteps:
              type: integer
            steps:
              type: array
              items:
                type: object
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
        meta:
          type: object
    CrashRecoveryStatusResponse:
      type: object
      required:
        - success
        - statusCode
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          type: object
          properties:
            incarnationId:
              type: string
            scanIntervalMs:
              type: integer
            batchSize:
              type: integer
            leaseDurationMs:
              type: integer
            maxTakeovers:
              type: integer
            selfFenceMarginMs:
              type: integer
            maxConcurrentOwned:
              type: integer
            status:
              type: string
        meta:
          type: object
    CrashRecoveryOrphansResponse:
      type: object
      required:
        - success
        - statusCode
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          type: array
          items:
            type: object
            properties:
              sagaId:
                type: string
              leaseOwner:
                type: string
              leaseUntil:
                type: string
                format: date-time
              currentState:
                type: string
              takeoverCount:
                type: integer
              fencingToken:
                type: integer
        meta:
          type: object
    CrashRecoverySweepResponse:
      type: object
      required:
        - success
        - statusCode
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          type: object
          properties:
            reclaimedCount:
              type: integer
            timestamp:
              type: string
              format: date-time
        meta:
          type: object
    SequentialExecutionResponse:
      type: object
      required:
        - success
        - statusCode
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            publicId:
              type: string
            tenantId:
              type: string
            workflowDefinitionId:
              type: string
              format: uuid
            currentState:
              type: string
            currentStepIndex:
              type: integer
            totalSteps:
              type: integer
            phase:
              type: string
              enum: [FORWARD, COMPENSATING, ROLL_FORWARD]
            pivotReached:
              type: boolean
            version:
              type: integer
            ownerEpoch:
              type: integer
            finalOutput:
              type: object
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        meta:
          type: object
    ParallelGroupResponse:
      type: object
      required:
        - success
        - statusCode
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            publicId:
              type: string
            tenantId:
              type: string
            sagaId:
              type: string
              format: uuid
            joinPolicy:
              type: string
            state:
              type: string
              enum: [FANOUT_ACTIVE, JOIN_SUCCEEDED, JOIN_FAILED, COMPENSATED]
            totalBranches:
              type: integer
            succeededBranches:
              type: integer
            failedBranches:
              type: integer
            version:
              type: integer
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        meta:
          type: object
  headers:
    X-Trace-Id:
      description: W3C distributed trace identifier for request correlation
      schema:
        type: string
    X-Span-Id:
      description: Current span execution identifier
      schema:
        type: string
