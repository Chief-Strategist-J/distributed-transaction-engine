openapi: 3.1.0
info:
  title: distributed-transaction-engine API
  version: 1.0.0
paths:
  /api/v1/compensation/trigger:
    post:
      summary: Trigger saga compensation workflow and generate execution plan
      operationId: triggerCompensation
      parameters:
        - name: traceparent
          in: header
          required: true
          schema:
            type: string
        - name: x-request-id
          in: header
          required: true
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - id
                - publicId
                - tenantId
                - sagaId
                - reason
                - forwardSteps
              properties:
                id:
                  type: string
                  format: uuid
                publicId:
                  type: string
                tenantId:
                  type: string
                sagaId:
                  type: string
                  format: uuid
                reason:
                  type: string
                forwardSteps:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - stepId
                      - stepName
                      - isPivot
                      - forwardExecutionId
                      - forwardOutcome
                      - forwardOutput
                      - compensationAction
                      - executionOrder
                    properties:
                      stepId:
                        type: string
                      stepName:
                        type: string
                      isPivot:
                        type: boolean
                      forwardExecutionId:
                        type: string
                      forwardOutcome:
                        type: string
                      forwardOutput:
                        type: object
                      compensationAction:
                        type: string
                      executionOrder:
                        type: integer
      responses:
        '201':
          description: Compensation plan created and dispatched
        '400':
          description: Validation error or pivot step violation
        '409':
          description: Conflict or duplicate compensation plan

  /api/v1/compensation/step-complete:
    post:
      summary: Report completion or failure outcome for an individual step compensation
      operationId: completeStepCompensation
      parameters:
        - name: traceparent
          in: header
          required: true
          schema:
            type: string
        - name: x-request-id
          in: header
          required: true
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - planId
                - stepId
                - outcomeStatus
              properties:
                tenantId:
                  type: string
                planId:
                  type: string
                  format: uuid
                stepId:
                  type: string
                outcomeStatus:
                  type: string
                  enum: [COMPENSATED, NOT_COMPENSABLE, PARTIALLY_COMPENSATED, FAILED_RETRYABLE, NEEDS_ATTENTION]
                residualPayload:
                  type: object
                errorMessage:
                  type: string
      responses:
        '200':
          description: Step compensation outcome recorded
        '400':
          description: Validation error
        '404':
          description: Compensation plan or step not found

  /api/v1/compensation/plan/{sagaId}:
    get:
      summary: Fetch compensation plan and step execution status by saga identifier
      operationId: getCompensationPlan
      parameters:
        - name: sagaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: traceparent
          in: header
          required: true
          schema:
            type: string
        - name: x-request-id
          in: header
          required: true
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Compensation plan details retrieved
        '404':
          description: Plan not found

  /api/v1/sagas:
    post:
      summary: Initialize or create a new saga transaction
      operationId: createSaga
      parameters:
        - name: traceparent
          in: header
          required: true
          schema:
            type: string
        - name: x-request-id
          in: header
          required: true
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique idempotency key to prevent double registrations
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - id
                - publicId
                - tenantId
                - source
                - externalId
                - correlationId
              properties:
                id:
                  type: string
                  format: uuid
                publicId:
                  type: string
                  pattern: "^sag_[0-9a-zA-Z]{26}$"
                tenantId:
                  type: string
                source:
                  type: string
                externalId:
                  type: string
                correlationId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Saga created successfully
        '400':
          description: Validation error
        '409':
          description: Conflict (duplicate id/key)
  /api/v1/sagas/transitions:
    post:
      summary: Transition transaction state via FSM event
      operationId: transitionState
      parameters:
        - name: traceparent
          in: header
          required: true
          schema:
            type: string
        - name: x-request-id
          in: header
          required: true
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique idempotency key to prevent double registrations
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - sagaId
                - event
                - expectedVersion
                - fencingToken
                - reason
              properties:
                tenantId:
                  type: string
                sagaId:
                  type: string
                event:
                  type: string
                expectedVersion:
                  type: integer
                fencingToken:
                  type: integer
                reason:
                  type: string
      responses:
        '200':
          description: State transition succeeded
        '400':
          description: Validation error
        '404':
          description: Saga not found
        '409':
          description: Optimistic concurrency or illegal state transition conflict
  /api/v1/sagas/sequential/start:
    post:
      summary: Start a sequential saga execution pipeline
      operationId: startSequentialSaga
      parameters:
        - name: traceparent
          in: header
          required: true
          schema:
            type: string
        - name: x-request-id
          in: header
          required: true
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - id
                - publicId
                - tenantId
                - workflowDefinitionId
                - source
                - externalId
                - correlationId
                - payload
              properties:
                id:
                  type: string
                  format: uuid
                publicId:
                  type: string
                  pattern: "^seq_[0-9a-zA-Z]{26}$"
                tenantId:
                  type: string
                workflowDefinitionId:
                  type: string
                  format: uuid
                source:
                  type: string
                externalId:
                  type: string
                correlationId:
                  type: string
                  format: uuid
                payload:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Sequential saga started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SequentialExecutionResponse'
        '400':
          description: Validation error
        '409':
          description: Conflict or duplicate saga instance
        '500':
          description: Internal execution error
  /api/v1/sagas/sequential/{id}/resume:
    post:
      summary: Resume a paused or waiting sequential saga
      operationId: resumeSequentialSaga
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: traceparent
          in: header
          required: true
          schema:
            type: string
        - name: x-request-id
          in: header
          required: true
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - expectedVersion
                - ownerEpoch
              properties:
                tenantId:
                  type: string
                expectedVersion:
                  type: integer
                ownerEpoch:
                  type: integer
      responses:
        '200':
          description: Sequential saga resumed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SequentialExecutionResponse'
        '404':
          description: Saga not found
        '409':
          description: Concurrency conflict
  /api/v1/sagas/parallel/start:
    post:
      summary: Start a fork/join parallel saga group execution
      operationId: startParallelSaga
      parameters:
        - name: traceparent
          in: header
          required: true
          schema:
            type: string
        - name: x-request-id
          in: header
          required: true
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - id
                - publicId
                - tenantId
                - sagaId
                - joinPolicy
                - branches
              properties:
                id:
                  type: string
                  format: uuid
                publicId:
                  type: string
                  pattern: "^par_[0-9a-zA-Z]{26}$"
                tenantId:
                  type: string
                sagaId:
                  type: string
                  format: uuid
                joinPolicy:
                  type: string
                  enum: [ALL_REQUIRED, FIRST_SUCCESS, N_OF_M, ALL_SETTLED]
                quorumCount:
                  type: integer
                branches:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - branchId
                      - name
                      - role
                      - effectType
                      - payload
                    properties:
                      branchId:
                        type: string
                      name:
                        type: string
                      role:
                        type: string
                        enum: [REQUIRED, OPTIONAL, ALTERNATIVE]
                      effectType:
                        type: string
                        enum: [HOLD, COMPENSABLE]
                      payload:
                        type: object
                        additionalProperties: true
      responses:
        '201':
          description: Parallel group started successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParallelGroupResponse'
        '400':
          description: Validation error
        '409':
          description: Conflict
  /api/v1/inbox/ingest:
    post:
      summary: Ingest and deduplicate an incoming message or reply event
      operationId: ingestInboxMessage
      parameters:
        - name: traceparent
          in: header
          schema:
            type: string
        - name: x-request-id
          in: header
          schema:
            type: string
        - name: x-correlation-id
          in: header
          schema:
            type: string
        - name: x-tenant-id
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - publicId
                - tenantId
                - source
                - externalId
                - correlationId
                - handlerName
                - handlerGeneration
                - producerEventTime
                - payload
              properties:
                id:
                  type: string
                  format: uuid
                publicId:
                  type: string
                  pattern: '^inb_[0-9a-zA-Z]{26}$'
                tenantId:
                  type: string
                source:
                  type: string
                externalId:
                  type: string
                correlationId:
                  type: string
                  format: uuid
                handlerName:
                  type: string
                handlerGeneration:
                  type: integer
                producerEventTime:
                  type: string
                  format: date-time
                payload:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Duplicate message safely absorbed
        '201':
          description: Message ingested and applied successfully
        '400':
          description: Validation error
        '409':
          description: Integrity mismatch or conflict
  /api/v1/idempotency/acquire:
    post:
      summary: Acquire or evaluate authoritative idempotency key
      operationId: acquireIdempotencyKey
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - publicId
                - tenantId
                - source
                - externalId
                - correlationId
                - principalId
                - operationId
                - idempotencyKey
                - payload
              properties:
                id:
                  type: string
                  format: uuid
                publicId:
                  type: string
                  pattern: '^idk_[0-9a-zA-Z]{26}$'
                tenantId:
                  type: string
                source:
                  type: string
                externalId:
                  type: string
                correlationId:
                  type: string
                  format: uuid
                principalId:
                  type: string
                operationId:
                  type: string
                idempotencyKey:
                  type: string
                  maxLength: 128
                payload:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Key replayed from stored snapshot
          headers:
            Idempotent-Replayed:
              schema:
                type: string
                example: 'true'
        '201':
          description: Key acquired fresh for in-flight execution
        '400':
          description: Validation error
        '409':
          description: Operation in progress or payload fingerprint mismatch
  /api/v1/idempotency/commit:
    post:
      summary: Commit final response snapshot to authoritative idempotency key
      operationId: commitIdempotencyOutcome
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenantId
                - id
                - state
                - snapshot
              properties:
                tenantId:
                  type: string
                id:
                  type: string
                  format: uuid
                state:
                  type: string
                  enum: [COMPLETED, REJECTED_FINAL]
                snapshot:
                  type: object
                  required:
                    - statusCode
                  properties:
                    statusCode:
                      type: integer
                    headers:
                      type: object
                      additionalProperties:
                        type: string
                    body:
                      type: object
                      additionalProperties: true
                resourceReference:
                  type: string
      responses:
        '200':
          description: Snapshot committed successfully
        '400':
          description: Validation error
        '409':
          description: Record not found or update conflict
  /api/v1/retry-policies/evaluate:
    post:
      summary: Evaluate step failure against retry policy and circuit breaker
      operationId: evaluateRetryPolicy
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenantId
                - sagaId
                - stepId
                - attemptNumber
                - statusCode
                - capability
                - position
                - firstAttemptTime
                - policy
              properties:
                tenantId:
                  type: string
                sagaId:
                  type: string
                  format: uuid
                stepId:
                  type: string
                attemptNumber:
                  type: integer
                statusCode:
                  type: integer
                errorMessage:
                  type: string
                retryAfterHeader:
                  type: string
                dependencyId:
                  type: string
                firstAttemptTime:
                  type: string
                  format: date-time
                effectiveDeadline:
                  type: string
                  format: date-time
                fingerprintHistory:
                  type: array
                  items:
                    type: string
                capability:
                  type: object
                  properties:
                    idempotentByKey:
                      type: boolean
                    statusQuery:
                      type: boolean
                    effectType:
                      type: string
                position:
                  type: string
                  enum: [COMPENSABLE, PIVOT, RETRIABLE]
                policy:
                  type: object
                  properties:
                    maxAttempts:
                      type: integer
                    maxElapsedSeconds:
                      type: integer
                    baseIntervalMillis:
                      type: integer
                    maxIntervalMillis:
                      type: integer
                    algorithm:
                      type: string
                      enum: [EXPONENTIAL_FULL_JITTER, EXPONENTIAL_EQUAL_JITTER, LINEAR_BACKOFF]
      responses:
        '200':
          description: Retry decision evaluated successfully
        '400':
          description: Validation error
  /api/v1/retry-policies/breaker/status:
    get:
      summary: Get dependency circuit breaker state
      operationId: getBreakerStatus
      parameters:
        - name: dependencyId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Circuit breaker status returned successfully
        '400':
          description: Missing dependencyId query param
  /api/v1/fencing/acquire:
    post:
      summary: Acquire or takeover a distributed lease with monotonically increasing epoch token
      operationId: acquireFencingLease
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - resourceId
                - holderId
                - leaseDurationMs
              properties:
                tenantId:
                  type: string
                resourceId:
                  type: string
                holderId:
                  type: string
                leaseDurationMs:
                  type: integer
                  minimum: 1000
      responses:
        '201':
          description: Lease acquired or taken over with incremented epoch token
        '400':
          description: Validation error
        '409':
          description: Lease currently held by another active holder
  /api/v1/fencing/renew:
    post:
      summary: Heartbeat renewal of an existing active lease keeping epoch constant
      operationId: renewFencingLease
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - resourceId
                - holderId
                - epoch
                - leaseDurationMs
              properties:
                tenantId:
                  type: string
                resourceId:
                  type: string
                holderId:
                  type: string
                epoch:
                  type: integer
                  minimum: 1
                leaseDurationMs:
                  type: integer
                  minimum: 1000
      responses:
        '200':
          description: Lease renewed successfully
        '400':
          description: Validation error
        '409':
          description: Renewal rejected (expired or epoch mismatch)
  /api/v1/fencing/release:
    post:
      summary: Graceful release of active lease
      operationId: releaseFencingLease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - resourceId
                - holderId
                - epoch
              properties:
                tenantId:
                  type: string
                resourceId:
                  type: string
                holderId:
                  type: string
                epoch:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Lease released successfully
        '400':
          description: Validation error
        '409':
          description: Cannot release lease owned by another holder or epoch
  /api/v1/fencing/barrier:
    post:
      summary: Statement 1 mutation barrier checking token >= stored_token
      operationId: validateFencedBarrier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - resourceId
                - token
              properties:
                tenantId:
                  type: string
                resourceId:
                  type: string
                token:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Fencing check passed
        '400':
          description: Validation error
        '409':
          description: Stale fencing token (zombie write suppressed)
  /api/v1/fencing/audits:
    get:
      summary: Retrieve fencing violation audit records
      operationId: getFencingAudits
      parameters:
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
        - name: resourceId
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Audits retrieved successfully
        '400':
          description: Missing resourceId query param
  /api/v1/compensation-retry/evaluate:
    post:
      summary: Evaluate step failure against compensation retry policies
      operationId: evaluateCompensationRetry
      responses:
        '200':
          description: Decision evaluated successfully
        '400':
          description: Bad request
  /api/v1/compensation-retry/record:
    get:
      summary: Get compensation retry record
      operationId: getCompensationRetryRecord
      parameters:
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
        - name: sagaId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: stepId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Record retrieved
        '404':
          description: Record not found
  /api/v1/compensation-retry/pause-step-type:
    post:
      summary: Pause compensations for a step type
      operationId: pauseCompensationStepType
      parameters:
        - name: stepType
          in: query
          required: true
          schema:
            type: string
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Step type paused
  /api/v1/compensation-retry/resume-step-type:
    post:
      summary: Resume compensations for a step type
      operationId: resumeCompensationStepType
      parameters:
        - name: stepType
          in: query
          required: true
          schema:
            type: string
        - name: tenantId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Step type resumed
  /api/v1/workflow-definitions:
    post:
      summary: Register and validate a new workflow DAG definition
      operationId: registerWorkflowDefinition
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: true
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: Unique idempotency key to prevent double registrations
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - tenantId
                - name
                - version
                - source
                - externalId
                - correlationId
                - steps
              properties:
                tenantId:
                  type: string
                name:
                  type: string
                  pattern: "^[a-zA-Z0-9_\\-\\.]{3,128}$"
                version:
                  type: integer
                  minimum: 1
                source:
                  type: string
                externalId:
                  type: string
                correlationId:
                  type: string
                  format: uuid
                steps:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - stepId
                      - stepName
                      - isPivot
                      - actionType
                      - actionEndpoint
                      - timeoutSeconds
                    properties:
                      stepId:
                        type: string
                        pattern: "^[a-zA-Z0-9_\\-]{2,64}$"
                      stepName:
                        type: string
                      isPivot:
                        type: boolean
                      actionType:
                        type: string
                      actionEndpoint:
                        type: string
                      compensationAction:
                        type: string
                      compensationEndpoint:
                        type: string
                      timeoutSeconds:
                        type: integer
                        minimum: 1
                        maximum: 86400
                      maxRetries:
                        type: integer
                        minimum: 0
                        maximum: 100
                      dependencies:
                        type: array
                        items:
                          type: string
      responses:
        '201':
          description: Workflow definition registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinitionResponse'
        '400':
          description: Schema validation error or missing required fields
        '409':
          description: Cyclic DAG detected or duplicate version / hash conflict
    get:
      summary: List registered workflow definitions for a tenant
      operationId: listWorkflowDefinitions
      parameters:
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of workflow definitions
  /api/v1/workflow-definitions/{id}:
    get:
      summary: Retrieve workflow definition by ID
      operationId: getWorkflowDefinitionById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow definition found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinitionResponse'
        '404':
          description: Workflow definition not found
  /api/v1/crash-recovery/status:
    get:
      summary: Retrieve crash recovery daemon status and active configuration
      operationId: getCrashRecoveryStatus
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Crash recovery status and configuration details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrashRecoveryStatusResponse'
  /api/v1/crash-recovery/orphans:
    get:
      summary: Query expired orphan sagas awaiting takeover
      operationId: getCrashRecoveryOrphans
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of orphaned saga instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrashRecoveryOrphansResponse'
  /api/v1/crash-recovery/sweep:
    post:
      summary: Trigger immediate manual sweep and reclamation cycle
      operationId: triggerCrashRecoverySweep
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: x-correlation-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                batchLimit:
                  type: integer
      responses:
        '200':
          description: Sweep execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrashRecoverySweepResponse'
        '400':
          description: Validation failed on unrecognized payload fields
components:
  schemas:
    WorkflowDefinitionResponse:
      type: object
      required:
        - success
        - statusCode
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            publicId:
              type: string
              pattern: "^wfd_[0-9a-zA-Z]{26}$"
            tenantId:
              type: string
            name:
              type: string
            version:
              type: integer
            source:
              type: string
            externalId:
              type: string
            correlationId:
              type: string
            specHash:
              type: string
            status:
              type: string
              enum: [ACTIVE, DEPRECATED, ARCHIVED]
            totalSteps:
              type: integer
            steps:
              type: array
              items:
                type: object
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
        meta:
          type: object
    CrashRecoveryStatusResponse:
      type: object
      required:
        - success
        - statusCode
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          type: object
          properties:
            incarnationId:
              type: string
            scanIntervalMs:
              type: integer
            batchSize:
              type: integer
            leaseDurationMs:
              type: integer
            maxTakeovers:
              type: integer
            selfFenceMarginMs:
              type: integer
            maxConcurrentOwned:
              type: integer
            status:
              type: string
        meta:
          type: object
    CrashRecoveryOrphansResponse:
      type: object
      required:
        - success
        - statusCode
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          type: array
          items:
            type: object
            properties:
              sagaId:
                type: string
              leaseOwner:
                type: string
              leaseUntil:
                type: string
                format: date-time
              currentState:
                type: string
              takeoverCount:
                type: integer
              fencingToken:
                type: integer
        meta:
          type: object
    CrashRecoverySweepResponse:
      type: object
      required:
        - success
        - statusCode
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          type: object
          properties:
            reclaimedCount:
              type: integer
            timestamp:
              type: string
              format: date-time
        meta:
          type: object
    SequentialExecutionResponse:
      type: object
      required:
        - success
        - statusCode
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            publicId:
              type: string
            tenantId:
              type: string
            workflowDefinitionId:
              type: string
              format: uuid
            currentState:
              type: string
            currentStepIndex:
              type: integer
            totalSteps:
              type: integer
            phase:
              type: string
              enum: [FORWARD, COMPENSATING, ROLL_FORWARD]
            pivotReached:
              type: boolean
            version:
              type: integer
            ownerEpoch:
              type: integer
            finalOutput:
              type: object
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        meta:
          type: object
    ParallelGroupResponse:
      type: object
      required:
        - success
        - statusCode
        - meta
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            publicId:
              type: string
            tenantId:
              type: string
            sagaId:
              type: string
              format: uuid
            joinPolicy:
              type: string
            state:
              type: string
              enum: [FANOUT_ACTIVE, JOIN_SUCCEEDED, JOIN_FAILED, COMPENSATED]
            totalBranches:
              type: integer
            succeededBranches:
              type: integer
            failedBranches:
              type: integer
            version:
              type: integer
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        meta:
          type: object
  headers:
    X-Trace-Id:
      description: W3C distributed trace identifier for request correlation
      schema:
        type: string
    X-Span-Id:
      description: Current span execution identifier
      schema:
        type: string
