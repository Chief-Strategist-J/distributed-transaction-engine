feature: compensation-retry
mode: stateless_hexagonal
owner: core-platform-guild
entities:
  - entity: compensation_retries
    fields:
      - name: id
        type: uuid
        null: no
        default: gen_random_uuid()
        constraint: PK, UNIQUE(tenant_id, id), immutable
      - name: public_id
        type: text
        null: no
        constraint: UNIQUE, immutable, format 'cpr_' + 26 chars
      - name: tenant_id
        type: text
        null: no
        constraint: immutable, leads composite unique keys
      - name: source
        type: text
        null: no
        default: 'ENGINE_COMPENSATION'
        constraint: immutable
      - name: external_id
        type: text
        null: no
        constraint: immutable, CHECK (external_id = btrim(external_id) AND external_id <> '')
      - name: correlation_id
        type: text
        null: no
        constraint: immutable
      - name: saga_id
        type: uuid
        null: no
        constraint: immutable
      - name: step_id
        type: text
        null: no
        constraint: immutable, CHECK (step_id = btrim(step_id) AND step_id <> '')
      - name: step_type
        type: text
        null: no
        constraint: CHECK (step_type = btrim(step_type) AND step_type <> '')
      - name: dependency_id
        type: text
        null: no
        constraint: CHECK (dependency_id = btrim(dependency_id) AND dependency_id <> '')
      - name: attempt_number
        type: integer
        null: no
        default: 1
        constraint: CHECK (attempt_number >= 1)
      - name: max_attempts
        type: integer
        null: no
        default: 10
        constraint: CHECK (max_attempts >= 1 AND max_attempts <= 100)
      - name: first_attempt_at
        type: timestamptz
        null: no
        default: NOW()
      - name: business_deadline
        type: timestamptz
        null: no
      - name: next_retry_at
        type: timestamptz
        null: yes
      - name: status
        type: text
        null: no
        default: 'PENDING'
        constraint: CHECK (status IN ('PENDING', 'RETRY_SCHEDULED', 'VERIFYING_AMBIGUOUS', 'COMPENSATED', 'NEEDS_ATTENTION', 'STEP_TYPE_PAUSED', 'FROZEN_BREAKER'))
      - name: last_error
        type: text
        null: no
        default: ''
      - name: version
        type: bigint
        null: no
        default: 1
        constraint: CHECK (version >= 1)
      - name: created_at
        type: timestamptz
        null: no
      - name: updated_at
        type: timestamptz
        null: no
    invariants:
      - UNIQUE(tenant_id, saga_id, step_id)
      - UNIQUE(tenant_id, public_id)
      - UNIQUE(tenant_id, source, external_id)
      - retry horizon bounded by business_deadline
      - ambiguity verification required on timeouts

  - entity: compensation_step_type_pauses
    fields:
      - name: id
        type: uuid
        null: no
        default: gen_random_uuid()
        constraint: PK, UNIQUE(tenant_id, id), immutable
      - name: public_id
        type: text
        null: no
        constraint: UNIQUE, immutable, format 'stp_' + 26 chars
      - name: tenant_id
        type: text
        null: no
        constraint: immutable, leads composite unique keys
      - name: source
        type: text
        null: no
        default: 'ENGINE_COMPENSATION'
      - name: external_id
        type: text
        null: no
      - name: correlation_id
        type: text
        null: no
      - name: step_type
        type: text
        null: no
        constraint: CHECK (step_type = btrim(step_type) AND step_type <> '')
      - name: is_paused
        type: boolean
        null: no
        default: true
      - name: reason
        type: text
        null: no
        default: ''
      - name: version
        type: bigint
        null: no
        default: 1
      - name: created_at
        type: timestamptz
        null: no
      - name: updated_at
        type: timestamptz
        null: no
    invariants:
      - UNIQUE(tenant_id, step_type)
      - UNIQUE(tenant_id, public_id)

pii: [none]
source_of_truth: db
